services:
  geth:
    image: ethereum/client-go:stable
    container_name: geth-local
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    volumes:
      - ./data/geth:/root/.ethereum
    command:
      - --dev
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3,debug,txpool
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.api=eth,net,web3,debug,txpool
      - --datadir=/root/.ethereum
    restart: unless-stopped
